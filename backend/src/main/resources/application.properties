# ============================================================
# SUBRAMANI ENTERPRISES - BACKEND CONFIGURATION
# ============================================================
# Values below use environment variables with safe local
# defaults so the project runs out-of-the-box during
# development. For production, set the environment variables
# instead of editing this file directly.
# ============================================================

spring.application.name=subramani-enterprises-backend

# ---------------- Server ----------------
server.port=${SERVER_PORT:8080}

# ---------------- MySQL Datasource ----------------
# NOTE: Never hard-code real production credentials here.
# Set DB_URL / DB_USERNAME / DB_PASSWORD as environment
# variables when deploying.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/subramani_enterprises?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
# ddl-auto=validate is safer for production once schema.sql has
# been run manually. Use "update" only in local development if
# you want Hibernate to auto-create tables from entities.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------------- CORS ----------------
# Comma-separated list of allowed frontend origins.
# Update this with your deployed frontend URL in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------------- Logging ----------------
logging.level.root=INFO
logging.level.com.subramanienterprises=INFO
